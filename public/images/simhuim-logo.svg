<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="white"/>

  <!-- Flame / Torch Icon (UIM-inspired style) -->
  <!-- Left outer flame (gold) -->
  <path d="M72,145 C55,125 50,100 60,78 C65,68 58,55 62,42 C68,55 65,68 72,80 C80,95 78,120 72,145Z"
        fill="#F59E0B" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Center main flame (teal) -->
  <path d="M100,150 C80,125 75,95 85,68 C90,52 84,35 90,20 C98,38 94,55 100,72 C110,95 108,125 100,150Z"
        fill="#0D9488" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right inner flame (gold) -->
  <path d="M128,145 C145,125 150,100 140,78 C135,68 142,55 138,42 C132,55 135,68 128,80 C120,95 122,120 128,145Z"
        fill="#F59E0B" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Center highlight on teal flame -->
  <path d="M100,140 C88,118 86,95 93,75 C96,65 93,52 97,40 C102,52 100,65 104,75 C111,95 112,118 100,140Z"
        fill="#14B8A6" opacity="0.6"/>

  <!-- "UIM" style text block -->
  <!-- U shape (teal block) -->
  <rect x="42" y="155" width="22" height="32" rx="4" fill="#0D9488" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="42" y="155" width="22" height="18" rx="4" fill="#0D9488"/>
  <rect x="44" y="158" width="18" height="12" rx="2" fill="white"/>

  <!-- i dot (gold square) -->
  <rect x="89" y="155" width="22" height="6" rx="2" fill="#F59E0B" stroke="#1a1a1a" stroke-width="1"/>
  <!-- i body -->
  <rect x="89" y="164" width="22" height="23" rx="3" fill="#0D9488" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- M shape (teal) -->
  <rect x="136" y="155" width="22" height="32" rx="4" fill="#0D9488" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="138" y="158" width="7" height="18" rx="2" fill="white"/>
  <rect x="149" y="158" width="7" height="18" rx="2" fill="white"/>
  <!-- M peak -->
  <polygon points="138,158 147,170 158,158" fill="#0D9488"/>

  <!-- Bottom text: "SIMHUIM" -->
  <text x="100" y="200" font-family="'Arial', sans-serif" font-size="10" font-weight="bold"
        fill="#0D9488" text-anchor="middle" letter-spacing="2">SIMHUIM</text>
</svg>
